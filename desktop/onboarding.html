<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次配置 · 亦庄国投投后管理系统</title><style>
body{margin:0;background:#f4f7f3;color:#173f35;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:48px auto;padding:0 24px}.card{background:white;border:1px solid #dce6dc;border-radius:18px;padding:30px;box-shadow:0 12px 36px #173f3510}h1{margin:0 0 8px;font-size:30px}p{color:#68786d;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:600;margin:13px 0 6px}input,select{width:100%;box-sizing:border-box;border:1px solid #cbd8cb;border-radius:9px;padding:11px;font:inherit}button{margin-top:22px;background:#12634f;border:0;border-radius:9px;color:#fff;padding:12px 22px;font:600 15px;cursor:pointer}.muted{font-size:13px;color:#718176}.error{margin-top:14px;padding:12px;border-radius:9px;background:#fff0ef;color:#a43f39;white-space:pre-wrap}.success{margin-top:14px;padding:12px;border-radius:9px;background:#edf7ec}.hidden{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><section class="card"><h1>首次配置</h1><p>完成后应用会在本机启动。密钥仅保存到本机用户目录，不会展示在页面或发送到第三方。</p><form id="form"><div class="grid"><div><label>模型模式</label><select name="LLM_MODE"><option value="mock">模拟模式（先体验）</option><option value="live">真实模型</option></select></div><div><label>模型服务</label><select name="LLM_PROVIDER"><option value="openai_compatible">兼容 OpenAI Chat Completions</option><option value="glm">智谱 GLM</option></select></div></div><div class="grid"><div><label>模型名称</label><input name="LLM_MODEL" placeholder="例如 deepseek-chat"></div><div><label>接口地址</label><input name="LLM_BASE_URL" placeholder="https://api.example.com/v1"></div></div><label>模型 API Key（真实模型模式需要）</label><input name="LLM_API_KEY" type="password" autocomplete="off"><div class="grid"><div><label>通知模式</label><select name="OUTBOUND_MODE"><option value="mock">模拟通知（先体验）</option><option value="live">真实通知</option></select></div><div><label>自动提醒</label><select name="SCHEDULER_ENABLED"><option value="false">关闭</option><option value="true">开启</option></select></div></div><h3>邮件（真实通知可选）</h3><div class="grid"><div><label>SMTP 主机</label><input name="SMTP_HOST" placeholder="smtp.example.com"></div><div><label>SMTP 端口</label><input name="SMTP_PORT" value="465"></div><div><label>SMTP 用户</label><input name="SMTP_USER"></div><div><label>SMTP 密码</label><input name="SMTP_PASS" type="password" autocomplete="off"></div><div><label>发件地址</label><input name="SMTP_FROM"></div><div><label>收件地址</label><input name="MAIL_TO"></div></div><h3>飞书群机器人（真实通知可选）</h3><div class="grid"><div><label>Webhook</label><input name="FEISHU_WEBHOOK_URL" type="password" autocomplete="off"></div><div><label>关键词</label><input name="FEISHU_KEYWORD" value="投后提醒"></div></div><h3>扫描件 OCR</h3><div class="grid"><div><label>OCR 模式</label><select name="OCR_MODE"><option value="disabled">关闭（默认）</option><option value="mock">模拟 OCR（演示）</option><option value="tesseract">本机 Tesseract</option></select></div><div><label>OCR 语言包</label><input name="OCR_LANG" value="chi_sim+eng"></div><div><label>Tesseract 路径（可留空使用 PATH）</label><input name="OCR_TESSERACT_PATH" placeholder="例如 /opt/homebrew/bin/tesseract"></div><div><label>pdftoppm 路径（可留空使用 PATH）</label><input name="OCR_PDFTOPPM_PATH" placeholder="例如 /opt/homebrew/bin/pdftoppm"></div><div><label>模拟 OCR 文本（可选）</label><input name="OCR_MOCK_TEXT" placeholder="仅 mock 模式使用"></div><div><label>OCR 超时（毫秒）</label><input name="OCR_TIMEOUT_MS" type="number" min="1000" max="900000" step="1000" value="120000"></div></div><h3>运行保障</h3><div class="grid"><div><label>定时备份</label><select name="BACKUP_SCHEDULE_ENABLED"><option value="false">关闭</option><option value="true">开启</option></select></div><div><label>备份间隔（小时）</label><input name="BACKUP_INTERVAL_HOURS" type="number" min="0.01" step="0.01" value="24"></div><div><label>保留备份份数</label><input name="BACKUP_RETENTION" type="number" min="1" step="1" value="7"></div><div><label>告警 Webhook（可选）</label><input name="SUPERVISOR_ALERT_WEBHOOK_URL" type="url" placeholder="https://…"></div></div><p class="muted">守护进程会自动重启异常服务、轮换日志并记录告警。定时备份需要电脑和应用持续运行。</p><p class="muted">建议先用模拟模式熟悉流程；真实通知模式至少配置一个可用渠道。</p><button type="submit">保存配置并启动</button></form><div id="message" class="hidden"></div></section></main><script>
const form=document.getElementById('form'),message=document.getElementById('message');
form.addEventListener('submit',async event=>{event.preventDefault();message.className='muted';message.textContent='正在检查配置…';const values=Object.fromEntries(new FormData(form).entries());if(values.LLM_MODE==='live')values.ALLOW_EXTERNAL_MODEL='true';try{await window.yzgtDesktop.configure(values);const check=await window.yzgtDesktop.check();if(!check.ok)throw new Error('配置自检未通过，请回到终端或重新安装后检查配置。');await window.yzgtDesktop.start();message.className='success';message.textContent='配置完成，正在打开应用…';}catch(error){message.className='error';message.textContent=error.message||String(error);}});
</script></body></html>
