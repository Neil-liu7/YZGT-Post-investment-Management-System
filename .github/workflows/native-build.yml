name: native installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    # macOS hosted capacity is unavailable in this repository's current pool.
    # The arm64 DMG was built and smoke-tested locally; keep this legacy job
    # skipped so Windows release tags are not blocked by an unrelated runner.
    if: ${{ false }}
    # macos-14 ARM runners are not available in every GitHub-hosted pool;
    # keep this CI job portable by building the x64 target on macos-13.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run native:runtime -- --platform=darwin --arch=x64
      - run: npx electron-builder --config electron-builder.yml --mac dmg --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-installer
          path: dist-native/*.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run native:runtime -- --platform=win32 --arch=x64
      - run: npm run native:win
      - name: Install and smoke test Windows installer
        shell: pwsh
        run: |
          $userData = Join-Path $env:RUNNER_TEMP 'yzgt-native-user-data'
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          @('LLM_MODE=mock', 'OUTBOUND_MODE=mock', 'SCHEDULER_ENABLED=false') | Set-Content (Join-Path $userData '.env')
          $installer = Get-ChildItem 'dist-native/*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw '找不到 Windows NSIS 安装程序。' }
          $installDir = Join-Path $env:RUNNER_TEMP 'yzgt-native-installed'
          $installResult = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installResult.ExitCode -ne 0) { throw "NSIS 安装失败，退出码 $($installResult.ExitCode)。" }
          $exe = Get-ChildItem "$installDir/*.exe" | Where-Object { $_.Name -notmatch 'Update|uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "安装后找不到应用程序：$installDir" }
          $stdout = Join-Path $env:RUNNER_TEMP 'yzgt-native-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'yzgt-native-stderr.log'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--user-data-dir=$userData" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $port = $null
            for ($i = 0; $i -lt 80 -and -not $port; $i++) {
              Start-Sleep -Milliseconds 250
              if (Test-Path $stdout) {
                $match = [regex]::Match((Get-Content $stdout -Raw), 'http://127\.0\.0\.1:(\d+)')
                if ($match.Success) { $port = [int]$match.Groups[1].Value }
              }
            }
            if (-not $port) { throw "应用未报告本地端口。`n$(Get-Content $stdout -Raw -ErrorAction SilentlyContinue)`n$(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)" }
            $health = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/health"
            if ($health.StatusCode -ne 200) { throw "健康检查返回 $($health.StatusCode)。" }
          } finally {
            taskkill /PID $process.Id /T /F 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist-native/*Setup*.exe
